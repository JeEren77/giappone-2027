<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Giappone">
<title>Giappone 2027</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fff;--wash:#eef1f0;--ink:#16191d;--sub:#5d6670;--rule:#dde2e0;
  --tokyo:#13965a;--hakone:#1f6fc0;--kyoto:#7b3fa0;--nara:#a8732a;--osaka:#e2620e;--hiro:#c22d4a;--jp:#16191d;
  --sos:#d7263d;--me:#13965a;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--wash);color:var(--ink);font:16px/1.5 "Zen Kaku Gothic New",system-ui,sans-serif;font-weight:500}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid #2b7fff;outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--paper);padding:var(--safe-t) 0 calc(96px + var(--safe-b));position:relative}
.pad{padding:0 18px}
.num{font-variant-numeric:tabular-nums}
.sub{color:var(--sub)}.small{font-size:14px}.tiny{font-size:12.5px}
.top{padding:22px 18px 12px;display:flex;align-items:flex-end;gap:12px}
.top h1{margin:0;font-size:26px;font-weight:900;letter-spacing:-.01em;line-height:1.1}
.top .lead{font-size:14px;color:var(--sub);margin-top:4px}
.sq{margin-left:auto;border:1.5px solid var(--rule);background:#fff;border-radius:12px;min-width:42px;height:42px;font-size:17px;display:grid;place-items:center;padding:0 10px;font-weight:700}
.status{font-size:12.5px;color:var(--sub);padding:0 18px;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#b9c1c7}.dot.ok{background:var(--tokyo)}.dot.w{background:#e7b416}

/* widget personali */
.hello{padding:20px 18px 6px;display:flex;gap:12px;align-items:center}
.avatar{width:48px;height:48px;border-radius:14px;background:var(--me);color:#fff;display:grid;place-items:center;font-size:24px;flex:none}
.hello h1{margin:0;font-size:24px;font-weight:900;line-height:1.15}
.w{margin:12px 18px;border:2px solid var(--ink);border-radius:16px;overflow:hidden;background:#fff}
.w .wh{display:flex;align-items:center;gap:8px;padding:11px 14px 0}
.w .wh b{font-weight:900;font-size:15px}
.w .wh .r{margin-left:auto;font-size:12.5px;color:var(--sub)}
.w .wb{padding:8px 14px 14px}
.count{display:flex;align-items:flex-end;gap:12px;padding:16px 16px 14px;background:var(--me);color:#fff}
.count .n{font-size:64px;font-weight:900;line-height:.9;letter-spacing:-.03em}
.count .l{font-weight:700;font-size:16px;line-height:1.3;padding-bottom:4px}
.count .k{margin-left:auto;font-size:40px;font-weight:900;opacity:.35;line-height:1}
.mini{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:7px 0;border-top:1px solid var(--rule);font-size:15px}
.mini:first-child{border-top:0}
.mini .h{font-weight:900;color:var(--me)}
.wx-now{display:flex;align-items:center;gap:12px}
.wx-now .e{font-size:44px;line-height:1}
.wx-now .t{font-size:40px;font-weight:900;line-height:1}
.wx-days{display:flex;gap:6px;overflow-x:auto;margin-top:12px;padding-bottom:2px;scrollbar-width:none}
.wx-days::-webkit-scrollbar{display:none}
.wx-d{flex:none;min-width:64px;border-radius:12px;background:var(--wash);padding:8px 6px;text-align:center;font-size:12.5px;line-height:1.35}
.wx-d .e{font-size:22px;display:block}
.wx-d b{font-size:14px;display:block}
.wx-d.trip{background:#fff;border:2px solid var(--c,var(--ink))}
.hot{display:inline-block;background:#fde7e9;color:var(--sos);border-radius:8px;padding:2px 8px;font-weight:700;font-size:13px}
.fxrow{display:flex;align-items:baseline;gap:10px}
.fxrow .big{font-size:30px;font-weight:900}
.fxin{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.fxin label{border:1.5px solid var(--rule);border-radius:12px;padding:6px 10px;display:flex;align-items:center;gap:6px}
.fxin input{border:0;width:100%;font-size:22px;font-weight:900;min-width:0;background:transparent}
.fxin input:focus{outline:none}
.fxin span{font-weight:900;color:var(--sub)}
.bar{height:10px;background:var(--wash);border-radius:9px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--me)}
.notes{width:100%;border:1.5px solid var(--rule);border-radius:12px;padding:10px;min-height:90px;font-size:16px;resize:vertical}
.whobtns{display:flex;flex-wrap:wrap;gap:8px;margin:12px 18px}

/* linea */
.line{position:relative;padding:6px 18px 10px}
.stop{display:grid;grid-template-columns:62px 1fr;gap:12px;position:relative;padding:0 0 18px;border:0;background:none;text-align:left;width:100%}
.stop:before{content:"";position:absolute;left:30px;top:0;bottom:0;width:6px;background:var(--c);margin-left:-3px}
.stop.first:before{top:22px}.stop.last:before{bottom:calc(100% - 22px)}
.code{position:relative;z-index:1;justify-self:center;width:46px;height:46px;border-radius:11px;border:4px solid var(--c);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;font-weight:900}
.code b{font-size:11px;letter-spacing:.06em}.code span{font-size:17px;margin-top:1px}
.stop.today .code{background:var(--c);color:#fff}
.stop .info{padding-top:3px;min-width:0}
.stop .d{font-size:13px;color:var(--sub)}
.stop .t{font-weight:700;font-size:17px;line-height:1.3;display:block}
.stop .meta{font-size:13px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.transfer{display:grid;grid-template-columns:62px 1fr;gap:12px;margin:-6px 0 12px;align-items:center}
.transfer .x{justify-self:center;z-index:1;background:#fff;border:2px dashed var(--sub);border-radius:99px;font-size:12px;padding:1px 7px;font-weight:700}
.transfer .l{font-size:13px;color:var(--sub);font-weight:700}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
.fact{background:var(--wash);border-radius:8px;padding:4px 10px;font-size:13.5px;font-weight:700;border:0}

/* cartello */
.sign{margin:14px 18px 6px;border-radius:6px;overflow:hidden;border:2px solid var(--ink);background:#fff}
.sign .main{padding:16px 16px 12px;display:flex;align-items:center;gap:14px}
.badge{width:58px;height:58px;border-radius:13px;border:5px solid var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;line-height:1;flex:none}
.badge b{font-size:12px;letter-spacing:.06em}.badge span{font-size:22px;margin-top:2px}
.kanji{font-size:42px;font-weight:900;line-height:1;letter-spacing:.04em}
.romaji{font-size:16px;font-weight:700;margin-top:6px}
.sign .wxs{margin-left:auto;text-align:right;font-size:13px;line-height:1.3}
.sign .wxs .e{font-size:26px}
.sign .nav{background:var(--c);color:#fff;display:grid;grid-template-columns:1fr auto 1fr}
.sign .nav button{background:none;border:0;color:#fff;padding:9px 10px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;min-width:0}
.sign .nav button:disabled{opacity:.35}
.sign .nav button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sign .nav .nx{justify-content:flex-end}
.sign .nav .mid{padding:9px 6px;font-size:12px;font-weight:900;align-self:center}
.dayhead{padding:6px 18px 0}
.dayhead h2{margin:4px 0 2px;font-size:22px;font-weight:900;line-height:1.25}
.note{background:#fff8e1;border-left:4px solid #e7b416;padding:10px 12px;font-size:14.5px;margin:12px 18px 0;border-radius:0 8px 8px 0}
.tl{margin:16px 18px 0}
.ev{display:grid;grid-template-columns:54px 1fr auto;gap:10px;padding:12px 0;border-top:1px solid var(--rule);align-items:start}
.ev:first-child{border-top:0}
.ev .h{font-weight:900;font-size:16px;color:var(--c)}
.ev .what{font-weight:700;font-size:16.5px;line-height:1.3}
.ev .why{font-size:14.5px;color:var(--sub);margin-top:3px}
.ev.done .what{text-decoration:line-through;color:var(--sub)}
.ev .acts{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.ic{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--rule);background:#fff;display:grid;place-items:center;font-size:16px;text-decoration:none;padding:0}
.ic.on{background:var(--c,var(--ink));border-color:var(--c,var(--ink));color:#fff}
.row{display:flex;gap:8px;align-items:center}
.btns{display:flex;gap:8px;margin:16px 18px 0;flex-wrap:wrap}
.btn{border:1.5px solid var(--ink);background:#fff;border-radius:12px;padding:10px 14px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none}
.btn.solid{background:var(--ink);color:#fff}
.btn.soft{border-color:var(--rule)}
.btn.sm{padding:7px 11px;font-size:14px;border-radius:10px}
.btn.wide{flex:1}
.btn:disabled{opacity:.4}
.aim{display:inline-block;width:18px;height:18px;border-radius:5px;background:linear-gradient(135deg,#13965a,#1f6fc0 45%,#7b3fa0 70%,#e2620e);color:#fff;font-size:10px;font-weight:900;line-height:18px;text-align:center}
.aibox{margin:16px 18px 0;border:2px solid var(--ink);border-radius:14px;padding:14px}
.aibox textarea{width:100%;border:1.5px solid var(--rule);border-radius:10px;padding:10px;min-height:64px;font-size:16px;margin:8px 0}
.prev{border-top:1px solid var(--rule);margin-top:10px;padding-top:6px}

/* sezioni */
.sec{margin:26px 18px 10px;display:flex;align-items:baseline;gap:8px}
.sec h3{margin:0;font-size:18px;font-weight:900}
.sec .r{margin-left:auto}
.todo{margin:0 18px;border:2px solid var(--ink);border-radius:12px;overflow:hidden}
.w .todo{margin:0;border:0}
.it{display:flex;gap:10px;padding:11px 12px;border-top:1px solid var(--rule);align-items:flex-start}
.it:first-child{border-top:0}
.w .it{padding:9px 0}
.cb{width:24px;height:24px;border-radius:7px;border:2px solid #b9c1c7;background:#fff;flex:none;display:grid;place-items:center;color:#fff;font-size:14px;padding:0;margin-top:1px}
.cb.on{background:var(--tokyo);border-color:var(--tokyo)}
.it .tx{flex:1;min-width:0}
.it.done .tx{color:var(--sub);text-decoration:line-through}
.when{display:block;font-size:13px;color:var(--osaka);font-weight:700}
.empty{color:var(--sub);text-align:center;padding:22px 18px;font-size:15px}
.seg{display:flex;margin:14px 18px 4px;border:2px solid var(--ink);border-radius:12px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;padding:9px 4px;font-weight:700;font-size:14px}
.seg button+button{border-left:2px solid var(--ink)}
.seg button.on{background:var(--ink);color:#fff}
.card{margin:10px 18px;border:1.5px solid var(--rule);border-radius:14px;padding:13px 14px;background:#fff}
.bk{display:flex;gap:12px}
.bk .e{font-size:24px;width:44px;height:44px;flex:none;border-radius:12px;background:var(--wash);display:grid;place-items:center}
.pnr{font-family:ui-monospace,Menlo,monospace;font-weight:700;background:var(--wash);border-radius:6px;padding:2px 8px;letter-spacing:.05em}
.bal{display:flex;justify-content:space-between;padding:7px 0;border-top:1px dashed var(--rule)}
.bal:first-child{border-top:0}
.pos{color:var(--tokyo);font-weight:900}.neg{color:var(--sos);font-weight:900}
.big{font-size:30px;font-weight:900;line-height:1.1}

/* chat */
.chat{padding:8px 18px 150px}
.msg{margin:12px 0;max-width:92%;white-space:pre-wrap;font-size:15.5px;line-height:1.55;overflow-wrap:anywhere}
.msg.u{margin-left:auto;background:var(--ink);color:#fff;border-radius:16px 16px 4px 16px;padding:10px 14px;width:fit-content}
.msg.a{background:var(--wash);border-radius:16px 16px 16px 4px;padding:12px 14px}
.msg .src{display:block;margin-top:8px;font-size:12.5px;color:var(--sub)}
.msg .src a{color:var(--hakone)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1.5px solid var(--rule);background:#fff;border-radius:99px;padding:8px 13px;font-weight:700;font-size:14px;text-align:left}
.composer{position:fixed;left:0;right:0;bottom:calc(64px + var(--safe-b));z-index:25;display:flex;justify-content:center;pointer-events:none}
.composer form{pointer-events:auto;max-width:560px;width:100%;background:#fff;border-top:1px solid var(--rule);padding:10px 12px;display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;border:1.5px solid var(--rule);border-radius:14px;padding:10px 12px;resize:none;max-height:120px;min-height:44px;font-size:16px}
.typing:after{content:"…";animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}

/* kit */
.conv{margin:0 18px;border:2px solid var(--ink);border-radius:14px;overflow:hidden}
.conv label{display:flex;align-items:center;gap:10px;padding:12px 14px}
.conv label+label{border-top:2px solid var(--ink)}
.conv .cur{font-weight:900;font-size:22px;width:26px}
.conv input{flex:1;border:0;font-size:30px;font-weight:900;min-width:0;background:transparent;font-variant-numeric:tabular-nums}
.conv input:focus{outline:none}
.qk{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 18px 0}
.qk button{border:1.5px solid var(--rule);background:#fff;border-radius:10px;padding:7px 2px;font-size:13px;font-weight:700;line-height:1.25}
.search{margin:0 18px 6px;width:calc(100% - 36px);border:1.5px solid var(--rule);border-radius:12px;padding:11px 13px;font-size:16px}
.phs{margin:0 18px}
.ph{padding:12px 0;border-top:1px solid var(--rule);display:flex;gap:10px;align-items:center;cursor:pointer}
.ph .ja{font-size:19px;font-weight:700;line-height:1.35}
.ph .ro{font-size:14px;color:var(--kyoto);font-weight:700}
.ph .itx{font-size:14.5px}
.phcat{font-weight:900;margin:18px 0 2px;font-size:15px}
.sos{margin:0 18px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sos a{background:var(--sos);color:#fff;border-radius:14px;padding:14px;text-decoration:none;font-weight:900}
.sos a b{display:block;font-size:30px;line-height:1}
.sos a span{font-size:13.5px;font-weight:700}
.rules{margin:0 18px}
.rules p{margin:0;padding:10px 0;border-top:1px solid var(--rule);font-size:15px}
.rules p:first-child{border-top:0}
.rules b{font-weight:900}
.show{position:fixed;inset:0;background:#fff;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.show .ja{font-size:44px;font-weight:900;line-height:1.3;overflow-wrap:anywhere}
.show .itx{margin-top:18px;color:var(--sub)}

/* barra */
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;justify-content:center;background:#fff;border-top:2px solid var(--ink);padding-bottom:var(--safe-b)}
nav.tabs .in{max-width:560px;width:100%;display:flex}
nav.tabs button{flex:1;background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11.5px;font-weight:700;color:var(--sub)}
nav.tabs .g{font-size:19px;font-weight:900;line-height:1.2}
nav.tabs button.on{color:var(--ink)}
nav.tabs button.on .g{color:#fff;background:var(--ink);border-radius:7px;padding:0 7px}

/* fogli */
.ov{position:fixed;inset:0;background:rgba(15,18,21,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(26px + var(--safe-b));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h4{margin:0 0 14px;font-size:20px;font-weight:900}
.sheet h5{margin:18px 0 8px;font-size:15px;font-weight:900}
.f{margin-bottom:12px}
.f label{display:block;font-size:13.5px;font-weight:700;color:var(--sub);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;border:1.5px solid var(--rule);border-radius:10px;padding:10px 12px;font-size:16px;background:#fff}
.f textarea{min-height:76px;resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--rule);border-radius:99px;padding:6px 12px;color:var(--ink);font-size:15px;margin:0}
.checks input{width:auto}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:36px;height:36px;border-radius:10px;border:3px solid transparent}
.swatches button.on{border-color:var(--ink)}
.wl{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--rule)}
.wl:first-child{border-top:0}
.wl label{flex:1;display:flex;align-items:center;gap:10px;font-weight:700}
.wl label input{width:20px;height:20px}
.toast{position:fixed;left:50%;bottom:calc(88px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14.5px;z-index:80;max-width:90%;font-weight:700}
.addrow{display:flex;gap:8px;margin:10px 18px}
.w .addrow{margin:8px 0 0}
.addrow input{flex:1;border:1.5px solid var(--rule);border-radius:10px;padding:10px 12px;font-size:16px;min-width:0}
code.k{font-family:ui-monospace,Menlo,monospace;background:var(--wash);padding:1px 5px;border-radius:5px;font-size:13px;word-break:break-all}
</style>
</head>
<body>
<div class="app" id="app"><div class="empty" style="padding-top:40vh">Carico…</div></div>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<div id="modal"></div>
<script type="module" src="app.js"></script>
</body>
</html>
