<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Giappone">
<title>Giappone 2027</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin>
<style>
:root{
  --bg:#F2F2F7;--card:#FFFFFF;--card2:#F2F2F7;--label:#000;--label2:rgba(60,60,67,.6);--label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.18);--fill:rgba(120,120,128,.12);--fill2:rgba(120,120,128,.2);--bar:rgba(249,249,249,.82);
  --tint:#E2421F;--tint-soft:rgba(226,66,31,.12);--green:#34C759;--red:#FF3B30;--orange:#FF9500;--blue:#007AFF;--yellow:#FFCC00;
  --tokyo:#13965A;--hakone:#1F6FC0;--kyoto:#7B3FA0;--nara:#A8732A;--osaka:#E2620E;--hiro:#C22D4A;--jp:#8E8E93;
  --me:#E2421F;--shadow:0 1px 0 rgba(0,0,0,.02),0 6px 24px rgba(0,0,0,.06);
  --sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Hiragino Kaku Gothic ProN","Helvetica Neue",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000;--card:#1C1C1E;--card2:#2C2C2E;--label:#fff;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.55);--fill:rgba(118,118,128,.24);--fill2:rgba(118,118,128,.32);--bar:rgba(22,22,24,.82);
  --tint:#FF5A3C;--tint-soft:rgba(255,90,60,.18);--green:#30D158;--red:#FF453A;--orange:#FF9F0A;--blue:#0A84FF;
  --tokyo:#30B872;--hakone:#4A94E0;--kyoto:#A56BCB;--nara:#C8955A;--osaka:#FF8A3D;--hiro:#E8506E;--shadow:none;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--label);font:17px/1.35 var(--font);letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--tint);text-decoration:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.app{max-width:600px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + var(--sb))}
.num{font-variant-numeric:tabular-nums}
.l2{color:var(--label2)}.l3{color:var(--label3)}
.fn{font-size:13px}.sub{font-size:15px}.cap{font-size:12px}
.b{font-weight:600}.bb{font-weight:700}

/* ---------- barra di navigazione ---------- */
.nav{position:sticky;top:0;z-index:20;padding-top:var(--st);background:transparent;transition:background .2s,border-color .2s;border-bottom:.5px solid transparent}
.nav.solid{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom-color:var(--sep)}
.nav .in{height:44px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 8px}
.nav .t{font-weight:600;font-size:17px;opacity:0;transition:opacity .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
.nav.solid .t{opacity:1}
.nav .lft{justify-self:start}.nav .rgt{justify-self:end;display:flex;gap:4px;align-items:center}
.navbtn{color:var(--tint);font-size:17px;padding:8px;display:inline-flex;align-items:center;gap:2px;min-height:44px}
.navbtn svg{width:22px;height:22px}
.lt{padding:2px 16px 8px;display:flex;align-items:flex-end;gap:12px}
.lt h1{margin:0;font-size:34px;font-weight:700;letter-spacing:.01em;line-height:1.15;flex:1}
.lt .date{font-size:13px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.02em;margin-bottom:2px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--me);display:grid;place-items:center;color:#fff;font-size:19px;flex:none;margin-bottom:4px}

/* ---------- elenchi raggruppati ---------- */
.sh{margin:22px 32px 7px;font-size:13px;color:var(--label2);text-transform:uppercase;letter-spacing:.01em;display:flex;align-items:baseline}
.sh .r{margin-left:auto;text-transform:none;font-size:15px}
.sf{margin:7px 32px 0;font-size:13px;color:var(--label2);line-height:1.4}
.group{margin:0 16px;background:var(--card);border-radius:12px;overflow:hidden}
.cell{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 16px;position:relative;width:100%;text-align:left;color:var(--label)}
.cell+.cell:before{content:"";position:absolute;top:0;right:0;left:16px;border-top:.5px solid var(--sep)}
.cell.ic+.cell:before,.cell.ic+.cell.ic:before{left:57px}
.cell .body{flex:1;min-width:0;padding:11px 0}
.cell .body .t1{font-size:17px;line-height:1.3}
.cell .body .t2{font-size:15px;color:var(--label2);margin-top:2px;line-height:1.3}
.cell .acc{color:var(--label2);font-size:17px;display:flex;align-items:center;gap:6px;flex:none}
.chev{width:8px;height:13px;flex:none;color:var(--label3)}
.sq{width:29px;height:29px;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:16px;flex:none}
.sq svg{width:18px;height:18px}
.cell.done .t1{color:var(--label2);text-decoration:line-through}
.check{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--label3);flex:none;display:grid;place-items:center;color:#fff}
.check.on{background:var(--green);border-color:var(--green)}
.check svg{width:14px;height:14px}

/* ---------- schede "widget" ---------- */
.card{margin:12px 16px;background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.card .ch{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.card .ch .k{font-size:15px;font-weight:600;color:var(--label2);display:flex;align-items:center;gap:6px}
.card .ch .r{margin-left:auto;font-size:13px;color:var(--label2)}
.hero{margin:6px 16px 12px;border-radius:22px;padding:18px;color:#fff;background:var(--hc,var(--tint));position:relative;overflow:hidden;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end}
.hero .kj{position:absolute;right:-6px;top:-18px;font-size:150px;font-weight:800;opacity:.16;line-height:1;font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
.hero .n{font-size:64px;font-weight:800;line-height:.95;letter-spacing:-.03em}
.hero .l{font-size:17px;font-weight:600;opacity:.95;margin-top:4px}
.hero .s{font-size:15px;opacity:.85;margin-top:2px}
.next{display:flex;gap:12px;align-items:flex-start}
.next .tm{font-size:28px;font-weight:700;color:var(--tint);line-height:1}
.next .w{flex:1;min-width:0}
.next .w b{font-size:19px;font-weight:600;display:block;line-height:1.25}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:6px 12px;font-size:15px;font-weight:600;background:var(--tint-soft);color:var(--tint)}
.pill.fill{background:var(--tint);color:#fff}
.pill.gray{background:var(--fill);color:var(--label)}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.wx{display:flex;align-items:center;gap:12px}
.wx .e{font-size:46px;line-height:1}
.wx .tp{font-size:44px;font-weight:300;line-height:1;letter-spacing:-.02em}
.wxd{display:flex;gap:4px;overflow-x:auto;margin:14px -16px -4px;padding:0 16px 4px;scrollbar-width:none}
.wxd::-webkit-scrollbar{display:none}
.wxd .d{flex:none;width:58px;text-align:center;font-size:13px;line-height:1.5;padding:6px 0;border-radius:12px}
.wxd .d.trip{background:var(--fill)}
.wxd .d .e{font-size:22px;display:block;line-height:1.3}
.wxd .d b{font-size:15px;font-weight:600;display:block}
.dotc{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c)}
.alert{display:flex;gap:8px;align-items:flex-start;background:rgba(255,59,48,.1);color:var(--red);border-radius:12px;padding:10px 12px;font-size:15px;margin-top:12px}
.fxbig{font-size:34px;font-weight:700;letter-spacing:-.01em}
.conv{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;margin-top:12px}
.conv label{background:var(--fill);border-radius:12px;padding:8px 12px;display:flex;align-items:center;gap:6px}
.conv input{border:0;background:transparent;width:100%;font-size:22px;font-weight:600;min-width:0;padding:0}
.conv input:focus{outline:none}
.conv span{color:var(--label2);font-weight:600}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 16px}
.tool{background:var(--card);border-radius:16px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;box-shadow:var(--shadow)}
.tool .sq{width:40px;height:40px;border-radius:11px;font-size:20px}
.tool .sq svg{width:22px;height:22px}

/* ---------- cartello di stazione ---------- */
.sign{margin:8px 16px 4px;background:var(--card);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.sign .m{display:flex;align-items:center;gap:14px;padding:16px}
.badge{width:54px;height:54px;border-radius:13px;border:5px solid var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;line-height:1;flex:none;background:#fff;color:#111}
.badge b{font-size:11px;letter-spacing:.06em}.badge span{font-size:20px;margin-top:2px}
.badge.sm{width:40px;height:40px;border-width:4px;border-radius:10px}
.badge.sm b{font-size:9px}.badge.sm span{font-size:15px}
.kanji{font-size:38px;font-weight:800;line-height:1;letter-spacing:.04em}
.romaji{font-size:15px;font-weight:600;color:var(--label2);margin-top:5px}
.sign .wxs{margin-left:auto;text-align:right;font-size:13px;color:var(--label2);line-height:1.35}
.sign .wxs .e{font-size:28px}
.sign .bar{background:var(--c);color:#fff;display:grid;grid-template-columns:1fr auto 1fr}
.sign .bar button{color:#fff;padding:10px 12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;min-width:0}
.sign .bar button:disabled{opacity:.35}
.sign .bar button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sign .bar .nx{justify-content:flex-end}
.sign .bar .mid{font-size:12px;font-weight:700;align-self:center;opacity:.9}
.dayh{padding:14px 20px 0}
.dayh h2{margin:4px 0 0;font-size:24px;font-weight:700;line-height:1.2}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips .pill{flex:none}
.note{margin:12px 16px 0;background:rgba(255,204,0,.16);border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.4}
.tl .cell{align-items:flex-start}
.tl .tm{width:48px;flex:none;padding-top:12px;font-weight:600;font-size:15px;color:var(--c,var(--tint))}
.tl .acts{display:flex;gap:6px;padding-top:8px}
.ib{width:34px;height:34px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--tint);flex:none}
.ib svg{width:17px;height:17px}
.ib.on{background:var(--green);color:#fff}

/* ---------- elenco giorni ---------- */
.dl .cell{min-height:64px}
.dl .cell.today{background:var(--tint-soft)}
.transfer{display:flex;align-items:center;gap:8px;margin:10px 32px 4px;font-size:13px;color:var(--label2)}
.transfer b{font-size:11px;border:1px dashed var(--label2);border-radius:99px;padding:1px 7px;font-weight:700}

/* ---------- mappa ---------- */
#map{position:fixed;left:0;right:0;top:0;bottom:calc(49px + var(--sb));z-index:1}
.mapui{position:fixed;left:0;right:0;top:calc(var(--st) + 8px);z-index:5;display:flex;gap:8px;overflow-x:auto;padding:0 12px;scrollbar-width:none}
.mapui::-webkit-scrollbar{display:none}
.mapui button{flex:none;background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:99px;padding:8px 14px;font-size:15px;font-weight:600;box-shadow:0 2px 10px rgba(0,0,0,.12);display:flex;align-items:center;gap:6px}
.mapui button.on{background:var(--tint);color:#fff}
.mk{width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;border:2.5px solid #fff;display:grid;place-items:center;font-size:12px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.leaflet-popup-content-wrapper{border-radius:14px;background:var(--card);color:var(--label)}
.leaflet-popup-tip{background:var(--card)}
.leaflet-popup-content{margin:12px 14px;font:15px/1.35 var(--font)}
.leaflet-container{font-family:var(--font);background:var(--bg)}
.leaflet-control-attribution{font-size:10px}

/* ---------- controlli ---------- */
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin:6px 16px 4px}
.seg button{flex:1;padding:6px 4px;font-size:13px;font-weight:500;border-radius:7px;white-space:nowrap}
.seg button.on{background:var(--card);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
@media (prefers-color-scheme:dark){.seg button.on{background:#636366}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:12px 18px;font-size:17px;font-weight:600;background:var(--tint);color:#fff}
.btn.tinted{background:var(--tint-soft);color:var(--tint)}
.btn.gray{background:var(--fill);color:var(--label)}
.btn.sm{padding:7px 14px;font-size:15px;border-radius:99px}
.btn.full{width:100%}
.btn:disabled{opacity:.4}
.row{display:flex;gap:10px;align-items:center}
.btns{display:flex;gap:10px;margin:14px 16px 0}
.btns .btn{flex:1}
.sw{position:relative;width:51px;height:31px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw i{position:absolute;inset:0;background:var(--fill2);border-radius:99px;transition:.2s}
.sw i:after{content:"";position:absolute;width:27px;height:27px;left:2px;top:2px;background:#fff;border-radius:50%;box-shadow:0 3px 8px rgba(0,0,0,.15);transition:.2s}
.sw input:checked+i{background:var(--green)}
.sw input:checked+i:after{transform:translateX(20px)}
.empty{text-align:center;color:var(--label2);padding:28px 24px;font-size:15px;line-height:1.45}
.vote{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:48px;height:48px;border-radius:12px;background:var(--fill);font-size:13px;font-weight:700;color:var(--label2);flex:none;line-height:1.1}
.vote.on{background:var(--tint);color:#fff}
.vote span{font-size:18px}
.bar2{height:6px;background:var(--fill);border-radius:9px;overflow:hidden;margin-top:6px}
.bar2 i{display:block;height:100%;background:var(--me)}

/* ---------- chat ---------- */
.chat{padding:8px 16px 140px}
.msg{margin:6px 0;max-width:82%;white-space:pre-wrap;font-size:17px;line-height:1.38;overflow-wrap:anywhere;padding:8px 13px;border-radius:19px;width:fit-content}
.msg.u{margin-left:auto;background:var(--tint);color:#fff;border-bottom-right-radius:6px}
.msg.a{background:var(--card);border-bottom-left-radius:6px}
.msg .src{display:block;margin-top:6px;font-size:13px;color:var(--label2)}
.msg .src a{color:var(--blue)}
.sugg{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.sugg button{background:var(--card);border-radius:14px;padding:12px 14px;text-align:left;font-size:15px;display:flex;gap:10px;align-items:center}
.composer{position:fixed;left:0;right:0;bottom:calc(49px + var(--sb));z-index:15;display:flex;justify-content:center;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep)}
.composer form{max-width:600px;width:100%;display:flex;gap:8px;align-items:flex-end;padding:8px 12px}
.composer textarea{flex:1;border:.5px solid var(--sep);background:var(--card);border-radius:20px;padding:8px 14px;resize:none;max-height:120px;min-height:38px;font-size:17px;line-height:1.3}
.composer textarea:focus{outline:none}
.send{width:34px;height:34px;border-radius:50%;background:var(--tint);color:#fff;display:grid;place-items:center;flex:none;margin-bottom:2px}
.send svg{width:18px;height:18px}
.typing:after{content:"…";animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}

/* ---------- barra delle schede ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding-bottom:var(--sb)}
.tabbar .in{max-width:600px;margin:0 auto;display:flex;height:49px}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:500;color:var(--label2)}
.tabbar button svg{width:26px;height:26px}
.tabbar button.on{color:var(--tint)}

/* ---------- fogli ---------- */
.ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--bg);width:100%;max-width:600px;max-height:94vh;overflow:auto;border-radius:12px 12px 0 0;padding-bottom:calc(24px + var(--sb));animation:up .32s cubic-bezier(.2,.9,.3,1)}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--label3);margin:6px auto 0}
.sheet .hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 8px 4px;position:sticky;top:0;background:var(--bg);z-index:2}
.sheet .hd .t{font-weight:600;font-size:17px}
.sheet .hd .navbtn.r{justify-self:end;font-weight:600}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet,.ov{animation:none}}
.fld{display:flex;align-items:center;min-height:44px;padding:0 16px;gap:12px;position:relative}
.fld+.fld:before{content:"";position:absolute;top:0;right:0;left:16px;border-top:.5px solid var(--sep)}
.fld>span{flex:none;min-width:92px;font-size:17px}
.fld input,.fld select,.fld textarea{flex:1;border:0;background:transparent;font-size:17px;padding:11px 0;min-width:0;text-align:right;color:var(--label)}
.fld textarea{text-align:left;min-height:84px;resize:vertical}
.fld.col{flex-direction:column;align-items:stretch;gap:0}
.fld.col>span{padding-top:11px;color:var(--label2);font-size:13px}
.fld.col textarea,.fld.col input{text-align:left}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none}
.fld input[type=date],.fld input[type=time]{-webkit-appearance:none;appearance:none}
.chk{display:flex;flex-wrap:wrap;gap:8px;padding:10px 0;justify-content:flex-end;flex:1}
.chk label{display:inline-flex;align-items:center;gap:6px;background:var(--fill);border-radius:99px;padding:6px 12px;font-size:15px}
.chk input{display:none}
.chk label:has(input:checked){background:var(--tint);color:#fff}
.swatches{display:flex;gap:10px;flex-wrap:wrap;padding:12px 16px}
.swatches button{width:36px;height:36px;border-radius:50%;border:3px solid transparent;font-size:20px;display:grid;place-items:center}
.swatches button.on{border-color:var(--label)}
.delb{display:block;width:calc(100% - 32px);margin:22px 16px 0;background:var(--card);color:var(--red);border-radius:12px;padding:12px;font-size:17px}
.show{position:fixed;inset:0;z-index:70;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.show .ja{font-size:46px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;top:calc(var(--st) + 10px);transform:translateX(-50%);background:var(--card2);color:var(--label);padding:12px 18px;border-radius:99px;font-size:15px;font-weight:600;z-index:90;box-shadow:0 8px 30px rgba(0,0,0,.2);max-width:90%;text-align:center;animation:fade .2s}
.ph .ja{font-size:20px;font-weight:600;line-height:1.35}
.ph .ro{font-size:15px;color:var(--tint)}
